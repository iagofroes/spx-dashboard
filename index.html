<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPX · Painel de Esteiras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Barlow+Condensed:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       #090c10;
    --surface:  #0f1419;
    --border:   #1e2733;
    --muted:    #2a3444;
    --text-dim: #4a6080;
    --text:     #8aa4c0;
    --text-hi:  #c8dff2;
    --accent:   #00d4ff;
    --green:    #00e676;
    --yellow:   #ffd600;
    --red:      #ff3d5a;
    --orange:   #ff7043;
    --amarela:  #ffd600;
    --vermelha: #ff3d5a;
    --rolete:   #00d4ff;
    --analisar: #b388ff;
    --branca:   #e0e0e0;
    --azul:     #448aff;
    --outros:   #69f0ae;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Barlow Condensed', sans-serif;
    overflow: hidden;
    user-select: none;
  }

  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 999; pointer-events: none;
    background: repeating-linear-gradient(
      to bottom, transparent 0px, transparent 3px,
      rgba(0,0,0,.07) 3px, rgba(0,0,0,.07) 4px
    );
  }

  /* ── SHELL ── */
  .shell {
    display: grid;
    grid-template-rows: 58px 1fr 44px;
    height: 100vh;
    padding: 8px 12px 6px;
    gap: 6px;
  }

  /* ── HEADER ── */
  header {
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--border); padding-bottom: 6px;
  }

  .logo { font-family: 'Space Mono', monospace; font-size: 18px; font-weight: 700; color: var(--accent); }
  .logo span { color: var(--text-dim); }
  .facility { font-size: 11px; letter-spacing: 2.5px; color: var(--text-dim); text-transform: uppercase; margin-left: 10px; }

  .hdr-kpis { display: flex; align-items: center; gap: 24px; }

  .kpi { display: flex; flex-direction: column; align-items: flex-end; }
  .kpi .lbl { font-size: 8px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-dim); }
  .kpi .val { font-family: 'Space Mono', monospace; font-size: 22px; font-weight: 700; line-height: 1; color: var(--text-hi); }
  .kpi .val.accent { color: var(--accent); }
  .kpi .val.green  { color: var(--green); }
  .kpi .val.yellow { color: var(--yellow); }

  .hora-badge {
    background: rgba(0,212,255,.1);
    border: 1px solid rgba(0,212,255,.3);
    border-radius: 3px;
    padding: 2px 10px;
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    color: var(--accent);
    letter-spacing: 1px;
  }

  .clock { font-family: 'Space Mono', monospace; font-size: 28px; font-weight: 700; color: var(--text-hi); letter-spacing: 2px; }

  /* ── GRID DINÂMICO DE ESTEIRAS ── */
  .esteiras-grid {
    display: grid;
    gap: 8px;
    overflow: hidden;
    /* colunas calculadas por JS conforme qtd de esteiras */
  }

  /* ── CARD ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  .card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  }

  .c-amarela::before  { background: var(--amarela);  box-shadow: 0 0 10px var(--amarela); }
  .c-vermelha::before { background: var(--vermelha); box-shadow: 0 0 10px var(--vermelha); }
  .c-rolete::before   { background: var(--rolete);   box-shadow: 0 0 10px var(--rolete); }
  .c-analisar::before { background: var(--analisar); box-shadow: 0 0 10px var(--analisar); }
  .c-branca::before   { background: var(--branca);   box-shadow: 0 0 10px var(--branca); }
  .c-azul::before     { background: var(--azul);     box-shadow: 0 0 10px var(--azul); }
  .c-outros::before   { background: var(--outros); }

  /* cabeçalho do card */
  .card-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px 6px;
    border-bottom: 1px solid var(--border);
  }

  .card-title { font-size: 13px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
  .c-amarela  .card-title { color: var(--amarela); }
  .c-vermelha .card-title { color: var(--vermelha); }
  .c-rolete   .card-title { color: var(--rolete); }
  .c-analisar .card-title { color: var(--analisar); }
  .c-branca   .card-title { color: var(--branca); }
  .c-azul     .card-title { color: var(--azul); }
  .c-outros   .card-title { color: var(--outros); }

  .badge { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; padding: 2px 8px; border-radius: 2px; text-transform: uppercase; }
  .b-ok   { background: rgba(0,230,118,.15); color: var(--green); }
  .b-warn { background: rgba(255,214,0,.15);  color: var(--yellow); }
  .b-low  { background: rgba(255,61,90,.15);  color: var(--red); }
  .b-na   { background: rgba(74,96,128,.15);  color: var(--text-dim); }

  /* corpo */
  .card-body { padding: 8px 12px; flex: 1; display: flex; flex-direction: column; gap: 7px; }

  /* número grande — hora atual */
  .hora-section { display: flex; flex-direction: column; }
  .sec-label { font-size: 8px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-dim); margin-bottom: 1px; }

  .num-row { display: flex; align-items: baseline; justify-content: space-between; }

  .big-num {
    font-family: 'Space Mono', monospace;
    font-size: 56px; font-weight: 700; line-height: 1;
    color: var(--text-hi);
    transition: color .4s;
  }

  .big-num.ok   { color: var(--green); }
  .big-num.warn { color: var(--yellow); }
  .big-num.low  { color: var(--red); }

  .side-stats { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
  .side-item  { display: flex; flex-direction: column; align-items: flex-end; }
  .side-lbl   { font-size: 8px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-dim); }
  .side-val   { font-family: 'Space Mono', monospace; font-size: 16px; color: var(--text-hi); line-height: 1; }

  /* barra de progresso */
  .prog-wrap { display: flex; flex-direction: column; gap: 3px; }
  .prog-labels { display: flex; justify-content: space-between; font-size: 9px; color: var(--text-dim); font-family: 'Space Mono', monospace; }
  .prog-track { height: 8px; background: var(--muted); border-radius: 2px; overflow: hidden; }
  .prog-fill  { height: 100%; border-radius: 2px; transition: width .8s ease; }

  .c-amarela  .prog-fill { background: var(--amarela); }
  .c-vermelha .prog-fill { background: var(--vermelha); }
  .c-rolete   .prog-fill { background: var(--rolete); }
  .c-analisar .prog-fill { background: var(--analisar); }
  .c-branca   .prog-fill { background: var(--branca); }
  .c-azul     .prog-fill { background: var(--azul); }
  .c-outros   .prog-fill { background: var(--outros); }

  /* bloco projeção + hora fechada */
  .proj-row { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }

  .proj-box {
    background: rgba(0,0,0,.3);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 5px 8px;
    display: flex; flex-direction: column; gap: 1px;
  }

  .pb-lbl { font-size: 8px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-dim); }
  .pb-val {
    font-family: 'Space Mono', monospace;
    font-size: 22px; font-weight: 700; line-height: 1;
    color: var(--text-hi);
  }
  .pb-val.up   { color: var(--green); }
  .pb-val.down { color: var(--red); }
  .pb-val.mid  { color: var(--yellow); }
  .pb-sub { font-size: 9px; color: var(--text-dim); }

  .trend { font-size: 12px; margin-left: 2px; }
  .trend.up   { color: var(--green); }
  .trend.down { color: var(--red); }
  .trend.mid  { color: var(--yellow); }

  /* mini histórico */
  .hist-section { display: flex; flex-direction: column; gap: 3px; flex: 1; justify-content: flex-end; }
  .mini-chart { display: flex; align-items: flex-end; gap: 3px; height: 40px; }
  .mb-group { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; height: 100%; justify-content: flex-end; }
  .mb-bar { width: 100%; border-radius: 1px 1px 0 0; min-height: 3px; opacity: .5; transition: height .4s; }
  .mb-bar.cur { opacity: 1; filter: brightness(1.4); }
  .c-amarela  .mb-bar { background: var(--amarela); }
  .c-vermelha .mb-bar { background: var(--vermelha); }
  .c-rolete   .mb-bar { background: var(--rolete); }
  .c-analisar .mb-bar { background: var(--analisar); }
  .c-branca   .mb-bar { background: var(--branca); }
  .c-azul     .mb-bar { background: var(--azul); }
  .c-outros   .mb-bar { background: var(--outros); }
  .mb-lbl { font-size: 8px; color: var(--text-dim); font-family: 'Space Mono', monospace; }

  .divider { height: 1px; background: var(--border); }

  /* ── FOOTER ── */
  footer {
    display: flex; align-items: center; justify-content: space-between;
    border-top: 1px solid var(--border); padding-top: 5px;
    font-size: 10px; color: var(--text-dim);
    font-family: 'Space Mono', monospace;
  }
  .footer-left { display: flex; gap: 16px; align-items: center; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 4px; animation: pulse 2s ease-in-out infinite; }
  .dot.green  { background: var(--green);  box-shadow: 0 0 5px var(--green); }
  .dot.red    { background: var(--red);    box-shadow: 0 0 5px var(--red); }
  .flash { color: var(--accent); opacity: 0; transition: opacity .3s; }
  .flash.show { opacity: 1; }

  /* erro */
  .erro-banner {
    position: fixed; bottom: 56px; left: 50%; transform: translateX(-50%);
    background: rgba(255,61,90,.15); border: 1px solid var(--red);
    border-radius: 4px; padding: 8px 20px;
    font-family: 'Space Mono', monospace; font-size: 11px; color: var(--red);
    display: none; z-index: 100;
  }
  .erro-banner.show { display: block; }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
</style>
</head>
<body>
<div class="shell">

  <header>
    <div style="display:flex;align-items:baseline;gap:10px">
      <div class="logo">SPX<span>·</span>OPS</div>
      <div class="facility">SoC_BA · Simões Filho</div>
    </div>
    <div class="hdr-kpis">
      <div class="kpi">
        <span class="lbl">Total Dia</span>
        <span class="val accent" id="hdr-total">—</span>
      </div>
      <div class="kpi">
        <span class="lbl">Hora Atual</span>
        <span class="val green" id="hdr-hora">—</span>
      </div>
      <div class="kpi">
        <span class="lbl">Meta Hora</span>
        <span class="val" id="hdr-meta">—</span>
      </div>
      <div class="kpi">
        <span class="lbl">Projeção</span>
        <span class="val yellow" id="hdr-proj">—</span>
      </div>
      <div class="kpi">
        <span class="lbl">% Meta</span>
        <span class="val" id="hdr-pct">—</span>
      </div>
      <div id="hora-badge" class="hora-badge">H —</div>
      <div class="clock" id="clock">--:--:--</div>
    </div>
  </header>

  <div class="esteiras-grid" id="esteiras-grid"></div>

  <footer>
    <div class="footer-left">
      <span><span class="dot green" id="status-dot"></span><span id="status-txt">ONLINE</span></span>
      <span id="fonte-label">SIMULAÇÃO</span>
      <span id="last-update">—</span>
    </div>
    <div style="display:flex;align-items:center;gap:14px">
      <span class="flash" id="flash">↻ ATUALIZADO</span>
      <span>PRÓXIMO: <span id="countdown">180</span>s</span>
    </div>
  </footer>
</div>

<div class="erro-banner" id="erro-banner"></div>

<script>
// ═══════════════════════════════════════════════
//  CONFIGURAÇÃO — edite após implantar o Apps Script
// ═══════════════════════════════════════════════
const CONFIG = {
  apiUrl:  'https://script.google.com/macros/s/AKfycbynjToNnUF7zF9G7sCzZXHpCG8Ud9RpH3idKA5pk0bUYwrIuC_6F9Ru_JoceoeRQ3oz/exec',
  refreshSec: 180,
  useMock:    false,   // → false quando a URL estiver configurada
};

// ── HELPERS ─────────────────────────────────────
function classCard(nome) {
  const n = (nome || '').toLowerCase();
  if (n.includes('amarela'))  return 'c-amarela';
  if (n.includes('vermelha')) return 'c-vermelha';
  if (n.includes('rolete'))   return 'c-rolete';
  if (n.includes('anali'))    return 'c-analisar';
  if (n.includes('branca'))   return 'c-branca';
  if (n.includes('azul'))     return 'c-azul';
  return 'c-outros';
}

function nomeEsteira(nome) {
  return nome.replace(/^esteira\s+/i, '').toUpperCase();
}

function badge(pct) {
  if (pct == null) return '<span class="badge b-na">S/META</span>';
  if (pct >= 85)   return '<span class="badge b-ok">OK</span>';
  if (pct >= 60)   return '<span class="badge b-warn">ATENÇÃO</span>';
  return '<span class="badge b-low">BAIXO</span>';
}

function numClass(pct) {
  if (pct == null) return '';
  if (pct >= 85)   return 'ok';
  if (pct >= 60)   return 'warn';
  return 'low';
}

// ── GRID DINÂMICO ────────────────────────────────
// Calcula colunas ideais para o número de esteiras
function calcCols(n) {
  if (n <= 2) return n;
  if (n <= 4) return n;
  if (n <= 6) return 3;
  if (n <= 8) return 4;
  return Math.ceil(n / 2);
}

// ── RENDER ESTEIRAS ──────────────────────────────
function renderEsteiras(data) {
  const grid = document.getElementById('esteiras-grid');

  // filtra esteiras com 0 total e sem operadores (provavelmente inativas hoje)
  const ativas = data.esteiras.filter(e =>
    e.totalDia > 0 || e.horaAtual > 0 || (e.topOperadores && e.topOperadores.length > 0)
  );

  const cols = calcCols(ativas.length || data.esteiras.length);
  const list = ativas.length ? ativas : data.esteiras;

  grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

  grid.innerHTML = '';

  const now      = new Date();
  const minDecor = now.getMinutes() + now.getSeconds() / 60;

  list.forEach(est => {
    const cls  = classCard(est.estacao);
    const pct  = est.pctMeta;
    const pctW = pct != null ? Math.min(100, pct) : 0;
    const nc   = numClass(pct);

    // projeção
    const proj = minDecor > 0 ? Math.round(est.horaAtual / minDecor * 60) : est.horaAtual;

    // hora anterior fechada
    const horaAnt    = data.horaAtual - 1;
    const horaFech   = est.historico.find(h => h.hora === horaAnt);
    const valFech    = horaFech ? horaFech.total : null;

    // tendência
    let trendCls = 'mid', trendSeta = '→';
    if (valFech != null && valFech > 0) {
      const diff = proj - valFech;
      if (diff > valFech * 0.05)        { trendCls = 'up';   trendSeta = '↑'; }
      else if (diff < -(valFech * 0.05)) { trendCls = 'down'; trendSeta = '↓'; }
    }

    // proj vs meta
    let projCls = 'mid';
    if (est.metaHora > 0) {
      if (proj >= est.metaHora * 0.85)    projCls = 'up';
      else if (proj < est.metaHora * 0.6) projCls = 'down';
    }

    // mini histórico
    const maxH = Math.max(...est.historico.map(h => h.total), 1);
    const miniBars = est.historico.map(h => {
      const p   = (h.total / maxH * 100).toFixed(1);
      const cur = h.hora === data.horaAtual;
      return `<div class="mb-group">
        <div class="mb-bar${cur ? ' cur' : ''}" style="height:${p}%"></div>
        <div class="mb-lbl">${String(h.hora).padStart(2,'0')}</div>
      </div>`;
    }).join('');

    const card = document.createElement('div');
    card.className = `card ${cls}`;
    card.innerHTML = `
      <div class="card-head">
        <span class="card-title">${nomeEsteira(est.estacao)}</span>
        ${badge(pct)}
      </div>
      <div class="card-body">

        <div class="hora-section">
          <div class="sec-label">HORA ${String(data.horaAtual).padStart(2,'0')}:00</div>
          <div class="num-row">
            <div class="big-num ${nc}">${est.horaAtual.toLocaleString('pt-BR')}</div>
            <div class="side-stats">
              <div class="side-item">
                <span class="side-lbl">ACUMULADO</span>
                <span class="side-val">${est.totalDia.toLocaleString('pt-BR')}</span>
              </div>
              <div class="side-item">
                <span class="side-lbl">META</span>
                <span class="side-val">${est.metaHora > 0 ? est.metaHora.toLocaleString('pt-BR') : '—'}</span>
              </div>
            </div>
          </div>
        </div>

        <div class="prog-wrap">
          <div class="prog-labels">
            <span>${pct != null ? pct + '%' : 'sem meta'}</span>
            <span>${pct != null ? (pct >= 85 ? '✓ no alvo' : pct >= 60 ? '⚠ abaixo' : '✗ crítico') : ''}</span>
          </div>
          <div class="prog-track"><div class="prog-fill" style="width:${pctW}%"></div></div>
        </div>

        <div class="divider"></div>

        <div class="proj-row">
          <div class="proj-box">
            <span class="pb-lbl">⟳ Projeção hora cheia</span>
            <span class="pb-val ${projCls}">${proj.toLocaleString('pt-BR')}<span class="trend ${trendCls}">${trendSeta}</span></span>
            <span class="pb-sub">${Math.round(est.horaAtual / Math.max(1, minDecor))}/min · ${Math.round(60 - minDecor)}min rest.</span>
          </div>
          <div class="proj-box">
            <span class="pb-lbl">✓ H${String(horaAnt).padStart(2,'0')} fechada</span>
            <span class="pb-val">${valFech != null ? valFech.toLocaleString('pt-BR') : '—'}</span>
            <span class="pb-sub">${valFech != null && est.metaHora > 0 ? Math.round(valFech / est.metaHora * 100) + '% da meta' : '—'}</span>
          </div>
        </div>

        <div class="divider"></div>

        <div class="hist-section">
          <div class="sec-label">TURNO</div>
          <div class="mini-chart">${miniBars || '<span style="color:var(--text-dim);font-size:11px">sem histórico</span>'}</div>
        </div>

      </div>
    `;
    grid.appendChild(card);
  });
}

// ── RENDER KPIs HEADER ───────────────────────────
function renderHeader(data) {
  const now      = new Date();
  const minDecor = now.getMinutes() + now.getSeconds() / 60;
  const projGeral = minDecor > 0
    ? Math.round(data.totalGeralHora / minDecor * 60)
    : data.totalGeralHora;

  document.getElementById('hdr-total').textContent = data.totalGeralDia.toLocaleString('pt-BR');
  document.getElementById('hdr-hora').textContent  = data.totalGeralHora.toLocaleString('pt-BR');
  document.getElementById('hdr-meta').textContent  = data.metaHoraAtual > 0 ? data.metaHoraAtual.toLocaleString('pt-BR') : '—';
  document.getElementById('hdr-proj').textContent  = projGeral.toLocaleString('pt-BR');
  document.getElementById('hora-badge').textContent = `H${String(data.horaAtual).padStart(2,'0')}`;

  const pctGeral = data.metaHoraAtual > 0
    ? Math.round(data.totalGeralHora / data.metaHoraAtual * 100) : null;

  const pctEl = document.getElementById('hdr-pct');
  pctEl.textContent = pctGeral != null ? pctGeral + '%' : '—';
  pctEl.style.color = pctGeral == null ? '' : pctGeral >= 85 ? 'var(--green)' : pctGeral >= 60 ? 'var(--yellow)' : 'var(--red)';

  const projEl = document.getElementById('hdr-proj');
  if (data.metaHoraAtual > 0) {
    const r = projGeral / data.metaHoraAtual;
    projEl.style.color = r >= 0.85 ? 'var(--green)' : r >= 0.6 ? 'var(--yellow)' : 'var(--red)';
  }
}

// ── MOCK DATA ────────────────────────────────────
function gerarMock() {
  const hora = new Date().getHours();
  const ESTEIRAS = [
    'Esteira Amarela', 'Esteira Vermelha', 'Esteira Rolete',
    'Analisar Esteiras', 'Esteira Branca', 'Esteira Azul'
  ];
  const metaHora = 450;
  const historicoGeral = {};

  const esteiras = ESTEIRAS.map(nome => {
    const perf      = 0.5 + Math.random() * 0.7;
    const horaAtual = Math.round(metaHora * perf);
    const historico = [];

    for (let h = 8; h <= Math.min(hora, 21); h++) {
      const v = Math.round(metaHora * (0.5 + Math.random() * 0.8));
      historico.push({ hora: h, total: v, meta: metaHora });
      historicoGeral[h] = (historicoGeral[h] || 0) + v;
    }

    return {
      estacao: nome, horaAtual,
      totalDia: Math.round(horaAtual * Math.max(1, hora - 7) * (0.8 + Math.random() * 0.4)),
      metaHora, pctMeta: Math.round(horaAtual / metaHora * 100),
      topOperadores: [], historico
    };
  });

  return {
    timestamp: new Date().toISOString(),
    horaReal: hora, horaAtual: hora,
    metaHoraAtual: metaHora * ESTEIRAS.length,
    totalGeralDia:  esteiras.reduce((s, e) => s + e.totalDia, 0),
    totalGeralHora: esteiras.reduce((s, e) => s + e.horaAtual, 0),
    esteiras,
    historicoGeral: Object.entries(historicoGeral)
      .map(([h, v]) => ({ hora: parseInt(h), total: v }))
      .sort((a, b) => a.hora - b.hora)
  };
}

// ── FETCH REAL via JSONP (contorna CORS do Apps Script) ──
function fetchDados() {
  return new Promise((resolve, reject) => {
    const cbName = 'spx_cb_' + Date.now();
    const script = document.createElement('script');
    const timeout = setTimeout(() => {
      cleanup();
      reject(new Error('Timeout JSONP'));
    }, 20000);

    function cleanup() {
      clearTimeout(timeout);
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
    }

    window[cbName] = function(data) {
      cleanup();
      if (data.erro) reject(new Error(data.erro));
      else resolve(data);
    };

    script.src = CONFIG.apiUrl + '?callback=' + cbName;
    script.onerror = () => { cleanup(); reject(new Error('Erro JSONP')); };
    document.head.appendChild(script);
  });
}

// ── LOAD ─────────────────────────────────────────
async function loadData() {
  try {
    const data = CONFIG.useMock ? gerarMock() : await fetchDados();

    renderEsteiras(data);
    renderHeader(data);

    document.getElementById('last-update').textContent =
      'atualizado ' + new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    document.getElementById('fonte-label').textContent =
      CONFIG.useMock ? 'SIMULAÇÃO' : 'APPS SCRIPT';

    // limpa erro se estava mostrando
    document.getElementById('erro-banner').classList.remove('show');
    document.getElementById('status-dot').className = 'dot green';
    document.getElementById('status-txt').textContent = 'ONLINE';

    const f = document.getElementById('flash');
    f.classList.add('show');
    setTimeout(() => f.classList.remove('show'), 2500);

  } catch (e) {
    console.error('Erro ao carregar:', e);
    const banner = document.getElementById('erro-banner');
    banner.textContent = '⚠ ERRO AO CARREGAR DADOS: ' + e.message;
    banner.classList.add('show');
    document.getElementById('status-dot').className = 'dot red';
    document.getElementById('status-txt').textContent = 'ERRO';
  }
}

// ── CLOCK ────────────────────────────────────────
function updateClock() {
  document.getElementById('clock').textContent =
    new Date().toLocaleTimeString('pt-BR', { hour12: false });
}
setInterval(updateClock, 1000);
updateClock();

// ── COUNTDOWN ────────────────────────────────────
let cd = CONFIG.refreshSec;
setInterval(() => {
  cd--;
  document.getElementById('countdown').textContent = cd;
  if (cd <= 0) { cd = CONFIG.refreshSec; loadData(); }
}, 1000);

loadData();
</script>
